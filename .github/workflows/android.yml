name: Build Android App

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          
      - name: Install JavaScript Dependencies
        run: npm ci || npm install
        
      - name: Build Web Assets (Vite)
        run: npm run build
        env:
          BUILD_TARGET: android
        
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Sync Capacitor Android Project
        run: npx cap sync android
        
      - name: Make gradlew executable
        working-directory: ./android
        run: chmod +x gradlew
        
      - name: Build Android APK (Debug)
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace
        
      - name: Build Android Release Bundle (AAB - for Play Store)
        working-directory: ./android
        run: ./gradlew bundleRelease --stacktrace
        
      - name: Build Android Release APK (Unsigned)
        working-directory: ./android
        run: ./gradlew assembleRelease --stacktrace
          
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Dimension3D-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Dimension3D-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          
      - name: Upload Release APK (Unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: Dimension3D-Release-APK-Unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
